# Trusted verification configuration for Tutorial. Lives beside the Challenges so the
# submission diff restriction protects it: a submitter who could edit `oracles` would
# switch off the gate that stops a record being defined as the problem's own `f`.

problem        = "Tutorial"
n-min          = 1
directions     = ["lower"]

# `#check_admissible` rejects a record whose *definition* transitively reaches any of
# these. Proofs may mention them freely.
oracles        = ["SqueezeBench.Tutorial.f", "SqueezeBench.Tutorial.g"]

# Heartbeat budget (maxHeartbeats units) for `decide +kernel` on the witness comparison.
fuel-budget-heartbeats = 200000
